const PAPERS = [{"grade":1,"term":"上","stage":1,"stageName":"第一次月考","scope":"人教版一年级上第1~3单元：准备课、位置、1-5的认识和加减法（约开学第4周进度）","questions":[{"q":"在○里填上>、<或=：3 ○ 5","a":"<","x":"先数一数，3个比5个少，少就用小于号。","v":"不会用一一对应的方法比较5以内数的大小。"},{"q":"按顺序填数：1、2、（　）、4、（　）","a":"3、5","x":"按1~5的顺序一个一个往下数。","v":"对1~5的数的顺序掌握不牢。"},{"q":"计算：2 + 3 = ？","a":"5","x":"想2和3合起来是5（分与合）。","v":"5以内加法的'合'没掌握。"},{"q":"计算：5 - 2 = ？","a":"3","x":"从5里面去掉2，剩下3。","v":"5以内减法的'去'没掌握。"},{"q":"5可以分成2和几？","a":"3","x":"想2加几等于5，2和3合成5。","v":"对5的分解与组成不熟。"},{"q":"从左往右数，●排在第3个；这一排一共有5个图形，从右往左数●排第几？","a":"第3个","x":"左边有2个，右边也有2个，两边数位置一样，都是第3。","v":"分不清左右方向，序数与左右结合易错。"},{"q":"计算：5 - 5 = ？","a":"0","x":"全部拿走就没有了，用0表示。","v":"不理解0表示'没有'，同数相减得0。"},{"q":"树上有4只小鸟，飞走了1只，还剩几只？","a":"3只","x":"用减法：4-1=3。","v":"不会从应用题文字里列减法算式。"}],"summary":"本卷常见漏洞集中在5以内数的大小比较、分与合，以及左右方向的判断。"},{"grade":1,"term":"上","stage":2,"stageName":"期中","scope":"人教版一年级上第4~5单元：认识图形（一）、6-10的认识和加减法（期中进度）","questions":[{"q":"按顺序填数：6、7、（　）、9、（　）","a":"8、10","x":"按6~10的顺序接着数。","v":"6~10的数序掌握不牢。"},{"q":"在○里填上>、<或=：8 ○ 6","a":">","x":"8比6多2，填大于号。","v":"不会比较10以内两个数的大小。"},{"q":"计算：6 + 3 = ？","a":"9","x":"想6和3合成9。","v":"10以内加法不熟。"},{"q":"计算：10 - 6 - 2 = ？","a":"2","x":"先算10-6=4，再算4-2=2，从左往右算。","v":"连减运算顺序不清，容易漏算一步。"},{"q":"魔方的形状是正方体还是长方体？","a":"正方体","x":"魔方每个面都是正方形，六个面一样大，是正方体。","v":"分不清正方体和长方体。"},{"q":"8可以分成3和几？","a":"5","x":"想3加几等于8，3和5合成8。","v":"对8的分解与组成不熟。"},{"q":"原来有9个气球，飞走了3个，还剩几个？","a":"6个","x":"去掉用减法：9-3=6。","v":"不会根据'飞走、拿走'等信息列减法算式。"},{"q":"8个小朋友排队，从前往后数，小刚排第6，他后面有几个小朋友？","a":"2个","x":"一共8人，排第6说明前面有5人，后面就是8-6=2人。","v":"把'排第几'和'有几个'混淆，序数问题易错。"}],"summary":"本卷常见漏洞在10以内数的组成、连减的运算顺序，以及立体图形的辨认。"},{"grade":1,"term":"上","stage":3,"stageName":"第二次月考","scope":"人教版一年级上第6~7单元：11-20各数的认识、认识钟表（第二次月考进度）","questions":[{"q":"13后面的一个数是多少？","a":"14","x":"按顺序接着数，13后面是14。","v":"对11~20的数序不熟。"},{"q":"16是由（　）个十和（　）个一组成的？","a":"1个十、6个一","x":"16里有一个'十'和一个'六'，就是1个十和6个一。","v":"不理解十几的数的组成（十位和个位的意义）。"},{"q":"在○里填上>、<或=：18 ○ 20","a":"<","x":"18没满20，比20小，填小于号。","v":"不会比较20以内两个数的大小，尤其跨十的数。"},{"q":"计算： 题列式或计算出错。"},{"q":"在○里填上>、<或=：13-6 ○ 8","a":"<","x":"先算13-6=7，7比8小，填小于号。","v":"先算再比的意识不够，容易只看数字猜大小。"}],"summary":"本卷常见漏洞在20以内退位减法（破十法、想加算减），这是本学期最重要的计算基础。"},{"grade":1,"term":"下","stage":2,"stageName":"期中","scope":"人教版一年级下第3~4单元：分类与整理、100以内数的认识（期中进度）","questions":[{"q":"按顺序填数：68、69、（　）、71","a":"70","x":"接下去数一个就是70。","v":"过'十'的数数（如69到70）容易卡住。"},{"q":"45里面有（　）个十和（　）个一？","a":"4个十、5个一","x":"十位是4就是4个十，个位是5就是5个一。","v":"对两位数的组成（位值概念）理解不透。"},{"q":"在○里填上>、<或=：78 ○ 87","a":"<","x":"先比十位，7个十比8个十小，所以78<87。","v":"不会先比十位再比个位来比较两位数。"},{"q":"比90少1的数是多少？","a":"89","x":"90往前数一个是89，满十退一到个位。","v":"整十数前后的数（89、91）容易写错。"},{"q":"把5、12、8、17、20、3分成两类，可以按什么标准分？每类是哪些数？","a":"按位数分：一位数是5、8、3，两位数是12、17、20","x":"分类要先定标准，比如按是一位数还是两位数分。","v":"没有'先定标准再分类'的意识。"},{"q":"10个十是多少？","a":"100","x":"9个十是90，再加1个十就是100。","v":"对'十'与'百'的十进制关系不清楚。"},{"q":"与79相邻的两个数是多少和多少？","a":"78和80","x":"79前面是78，后面是80。","v":"对'相邻的数'和过'十'的数数掌握不牢。"},{"q":"二(1)班喜欢苹果的有15人，喜欢香蕉的有20人，喜欢哪种水果的人数多？","a":"香蕉","x":"比较20和15，20大，喜欢香蕉的人多。","v":"不会根据统计结果作简单比较判断。"}],"summary":"本卷常见漏洞在100以内数的组成、过'十'数数和大小比较，分类题常因没先定标准而出错。"},{"grade":1,"term":"下","stage":3,"stageName":"第二次月考","scope":"人教版一年级下第5单元：认识人民币（第二次月考进度）","questions":[{"q":"1元 = （　）角","a":"10角","x":"元和角之间的进率是10：1元=10角。","v":"对元、角、分的十进关系记不牢。"},{"q":"5角 + 5角 = （　）元","a":"1元","x":"5角加5角是10角，10角就是1元。","v":"角满10要换成元，进率换算不熟。"},{"q":"1张10元可以换几张5元？","a":"2张","x":"2个5元合起来是10元。","v":"不熟悉人民币的面值兑换。"},{"q":"一支铅笔8角，一块橡皮2角，一共多少钱？","a":"10角（也就是1元）","x":"8角+2角=10角，10角=1元。","v":"角相加满10不会换算成元。"},{"q":"在○里填上>、<或=：1元 ○ 9角","a":">","x":"1元=10角，10角比9角大。","v":"比较钱数时忘记先统一单位。"},{"q":"买一本5元的书，付了一张10元，应找回几元？","a":"5元","x":"找回的钱=付的钱-花的钱：10-5=5。","v":"'找回'就是用减法，理解不到位。"},{"q":"38分 = （　）角（　）分","a":"3角8分","x":"10分=1角，38分里有3个10分和8个1分。","v":"分与角的进率换算不熟。"},{"q":"小明有1元，买尺子用去了6角，还剩几角？","a":"4角","x":"先统一单位：1元=10角，再算10-6=4角。","v":"单位不统一就直接算，容易出错。"}],"summary":"本卷常见漏洞在元角分的换算（满10进1）和购物付钱、找零的实际应用。"},{"grade":1,"term":"下","stage":4,"stageName":"期末","scope":"人教版一年级下全册综合：重点是第6~7单元100以内的加法和减法（一）、找规律（期末进度）","questions":[{"q":"计算：35 + 20 = ？","a":"55","x":"整十数加整十数：3个十加2个十是5个十，个位不变。","v":"两位数加整十数，数位对不齐。"},{"q":"计算：42 - 6 = ？","a":"36","x":"个位2减6不够，退位：12-6=6，十位剩3，得36。","v":"两位数减一位数的退位减法易错。"},{"q":"计算：26 + 8 = ？","a":"34","x":"个位6+8=14，满十进一，十位变成3，得34。","v":"两位数加一位数的进位加法漏进位。"},{"q":"计算：53 - 9 = ？","a":"44","x":"个位3减9不够，退位算13-9=4，得44。","v":"退位时十位忘记减1。"},{"q":"找规律填数：2、4、6、8、（　）、（　）","a":"10、12","x":"每次多2，接着数双数。","v":"找不出等差规律（每次加几）。"},{"q":"找规律填数：5、10、15、20、（　）、（　）","a":"25、30","x":"每次多5，继续加5。","v":"对'每次加5'这样的规律敏感性不够。"},{"q":"图书角有58本书，借走了20本，还剩多少本？","a":"38本","x":"用减法：58-20=38。","v":"两位数减整十数时把个位也减了。"},{"q":"停车场原来有25辆车，开走了8辆，又开来了6辆，现在有多少辆？","a":"23辆","x":"先减后加：25-8=17，17+6=23。","v":"两步计算应用题不会分步思考。"}],"summary":"本卷常见漏洞集中在100以内加减法的进位和退位，以及两步应用题的分步思考。"},{"grade":2,"term":"上","stage":1,"stageName":"第一次月考","scope":"人教版二年级上第1~2单元：长度单位、100以内的加法和减法（二）（约开学第4周进度）","questions":[{"q":"在括号里填上合适的单位：一支铅笔长约18（　）。","a":"厘米","x":"铅笔不到1米长，用厘米作单位合适。","v":"对厘米和米的实际长度没有量感。"},{"q":"在括号里填上合适的单位：教室门高约2（　）。","a":"米","x":"门比人还高，要用米作单位。","v":"厘米和米的选择混乱。"},{"q":"1米 = （　）厘米","a":"100","x":"米和厘米之间的进率是100。","v":"米与厘米的换算记不牢。"},{"q":"用竖式计算：36 + 27 = ？","a":"63","x":"个位6+7=13，满十进一，十位3+2+1=6。","v":"竖式计算漏进位。"},{"q":"用竖式计算：63 - 28 = ？","a":"35","x":"个位3减8不够，向十位借1当10，13-8=5。","v":"退位减法忘记向十位借1。"},{"q":"计算：24 + 18 + 9 = ？","a":"51","x":"从左往右算：24+18=42，42+9=51。","v":"连加时前一步结果抄错。"},{"q":"在○里填上>、<或=：1米 ○ 90厘米","a":">","x":"1米=100厘米，100>90。","v":"比较长度时忘记统一单位。"},{"q":"小明身高95厘米，再长几厘米就是1米？","a":"5厘米","x":"1米=100厘米，100-95=5厘米。","v":"要先统一单位再计算，这步意识不够。"}],"summary":"本卷常见漏洞在100以内加减法竖式的进位退位，以及米和厘米的量感与换算。"},{"grade":2,"term":"上","stage":2,"stageName":"期中","scope":"人教版二年级上第3~4单元：角的初步认识、表内乘法（一）（乘法的初步认识、2~6的乘法口诀）（期中进度）","questions":[{"q":"5 + 5 + 5 + 5 = 20，写成乘法算式是（　）×（　）= 20","a":"5×4=20（或4×5=20）","x":"相同加数是5，有4个5，就是5乘4。","v":"不理解乘法是相同加数连加的简便写法。"},{"q":"计算：6 × 4 = ？","a":"24","x":"想口诀：四六二十四。","v":"6的乘法口诀不熟。"},{"q":"计算：3 × 6 = ？","a":"18","x":"想口诀：三六十八。","v":"3和6的口诀混淆。"},{"q":"计算：5 × 5 = ？","a":"25","x":"想口诀：五五二十五。","v":"相同乘数（五五）的口诀记不准。"},{"q":"口诀'四六二十四'可以写出哪些乘法算式？","a":"4×6=24 和 6×4=24","x":"一句口诀一般能写两道乘法算式。","v":"口诀与算式之间的对应关系不清。"},{"q":"一个角有（　）个顶点和（　）条边？","a":"1个顶点、2条边","x":"角是由一个顶点和两条边组成的。","v":"角的组成要素没记住。"},{"q":"一副三角板上的每一个三角板各有几个直角？","a":"1个","x":"每个三角板都有1个直角和2个锐角。","v":"分不清直角、锐角、钝角。"},{"q":"每盒装6个乒乓球，4盒一共装多少个？","a":"24个","x":"求几个几用乘法：6×4=24。","v":"不会用乘法解决'每份数×份数'的问题。"}],"summary":"本卷常见漏洞在乘法的意义（几个几）和2~6口诀的熟练度，角的组成也常记不全。"},{"grade":2,"term":"上","stage":3,"stageName":"第二次月考","scope":"人教版二年级上第5~6单元：观察物体（一）、表内乘法（二）（7~9的乘法口诀）（第二次月考进度）","questions":[{"q":"计算：7 × 8 = ？","a":"56","x":"想口诀：七八五十六。","v":"7、8的口诀（易混段）不熟。"},{"q":"计算：9 × 6 = ？","a":"54","x":"想口诀：六九五十四。","v":"9的口诀记不准。"},{"q":"计算：8 × 8 = ？","a":"64","x":"想口诀：八八六十四。","v":"相同乘数的口诀易错。"},{"q":"计算：9 × 9 = ？","a":"81","x":"想口诀：九九八十一。","v":"大数口诀记忆不牢。"},{"q":"口诀'六七四十二'写出的乘法算式是（　）。","a":"6×7=42（或7×6=42）","x":"六七四十二对应6乘7。","v":"口诀和算式转换不熟练。"},{"q":"从不同方向观察一个长方体纸箱，一次最多能看到它的几个面？","a":"3个","x":"最多同时看到上面和相邻的两个侧面，共3个面。","v":"观察物体的空间想象能力不足。"},{"q":"每只小船坐8人，9只小船一共坐多少人？","a":"72人","x":"求9个8用乘法：8×9=72。","v":"'每份数×份数'的乘法应用题列式错误。"},{"q":"计算：8 × 7 - 8 = ？（提示：想想这表示几个8）","a":"48","x":"7个8减1个8是6个8，6×8=48；也可以先算56-8=48。","v":"不会用乘法意义简化计算。"}],"summary":"本卷常见漏洞在7、8、9口诀的熟练度（尤其易混句），观察物体需加强实物操作。"},{"grade":2,"term":"上","stage":4,"stageName":"期末","scope":"人教版二年级上全册综合：重点是第7~8单元认识时间、数学广角——搭配（一）（期末进度）","questions":[{"q":"钟面上时针指在8和9之间，分针指向6，是几时几分？","a":"8时30分","x":"时针过了8没到9，是8时多；分针指6是30分。","v":"不会读'几时几分'，时针位置判断不清。"},{"q":"1时 = （　）分","a":"60","x":"1小时有60分钟。","v":"时与分的进率记不牢。"},{"q":"用竖式计算：45 + 38 = ？","a":"83","x":"个位5+8=13，满十进一，十位4+3+1=8。","v":"竖式加法漏进位。"},{"q":"用竖式计算：82 - 47 = ？","a":"35","x":"个位2减7不够，借1当10，12-7=5，十位8借1剩7，7-4=3。","v":"退位减法中间借位步骤出错。"},{"q":"用数字1、2、3能组成几个不同的两位数？把它们写出来。","a":"6个：12、13、21、23、31、32","x":"按顺序搭配：先定十位再换个位，不重复不遗漏。","v":"搭配时遗漏或重复，缺乏有序思考。"},{"q":"每张桌子坐4人，9张桌子一共坐多少人？","a":"36人","x":"求9个4用乘法：4×9=36。","v":"乘法口诀应用不熟练。"},{"q":"二(1)班有男生25人，女生23人，全班一共有多少人？","a":"48人","x":"男女生合起来用加法：25+23=48。","v":"应用题数量关系判断不准。"},{"q":"小红上午8:10到校，8:40开始上课，从到校到上课经过了多少分钟？","a":"30分钟","x":"8:10到8:40，分针从2走到8，经过30分。","v":"不会计算经过的时间。"}],"summary":"本卷常见漏洞在认识时间（几时几分的认读、经过时间）和搭配问题的有序思考，竖式仍需巩固进位退位。"},{"grade":2,"term":"下","stage":1,"stageName":"第一次月考","scope":"人教版二年级下第1~2单元：数据收集整理、表内除法（一）（除法的初步认识、用2~6的乘法口诀求商）（约开学第4周进度）","questions":[{"q":"计算：12 ÷ 4 = ？","a":"3","x":"想口诀：三四十二，所以12÷4=3。","v":"用乘法口诀求商不熟练。"},{"q":"计算：15 ÷ 3 = ？","a":"5","x":"想口诀：三五十五。","v":"口诀求商时想错口诀。"},{"q":"计算：18 ÷ 6 = ？","a":"3","x":"想口诀：三六十八。","v":"乘除法之间的联系没建立。"},{"q":"20 ÷ 5 = 4 表示把20平均分成（　）份，每份是（　）。","a":"5份，每份是4","x":"除号前是总数，除号后是份数，商是每份数。","v":"不理解除法'平均分'的含义。"},{"q":"24个橘子，每6个装一袋，能装几袋？","a":"4袋","x":"求24里有几个6，用除法：24÷6=4。","v":"'包含分'问题不会列除法算式。"},{"q":"用画'正'字的方法记录数据，一个'正'字表示多少？","a":"5","x":"'正'字有5画，一画代表1，一个正字代表5。","v":"不了解'正'字计数的方法。"},{"q":"计算：30 ÷ 5 = ？","a":"6","x":"想口诀：五六三十。","v":"整十数除以一位数的口诀求商不熟。"},{"q":"把14个苹果平均分给7个小朋友，每人分几个？","a":"2个","x":"平均分用除法：14÷7=2。","v":"平均分问题与减法混淆。"}],"summary":"本卷常见漏洞在除法的两种含义（平均分、包含分）和用口诀求商的熟练度。"},{"grade":2,"term":"下","stage":2,"stageName":"期中","scope":"人教版二年级下第3~4单元：图形的运动（一）、表内除法（二）（用7~9的乘法口诀求商）（期中进度）","questions":[{"q":"计算：49 ÷ 7 = ？","a":"7","x":"想口诀：七七四十九。","v":"7的口诀求商不熟。"},{"q":"计算：63 ÷ 9 = ？","a":"7","x":"想口诀：七九六十三。","v":"9的口诀求商易错。"},{"q":"计算：72 ÷ 8 = ？","a":"9","x":"想口诀：八九七十二。","v":"大数口诀求商记忆不准。"},{"q":"下面的现象中，属于平移的是哪一个？（1）转动的风车 （2）推拉窗户 （3）转动的摩天轮","a":"（2）推拉窗户","x":"平移是物体沿直线移动，本身方向不变；转动是旋转。","v":"分不清平移和旋转。"},{"q":"剪纸时先把纸对折，再剪出图案，展开后两边一样，这是利用了图形的什么性质？","a":"轴对称（对称）","x":"对折剪出来的图案沿折线两边完全一样，是轴对称图形。","v":"对轴对称图形的特征不理解。"},{"q":"有45朵花，每9朵扎成一束，可以扎几束？","a":"5束","x":"求45里有几个9：45÷9=5。","v":"包含分的除法应用题列式错误。"},{"q":"计算：56 ÷ 7 + 20 = ？","a":"28","x":"先算56÷7=8，再算8+20=28。","v":"运算顺序不清，先算了加法。"},{"q":"钟面上时针的走动属于什么运动现象？","a":"旋转","x":"时针绕一个中心点转动，是旋转现象。","v":"对旋转现象的判断不准确。"}],"summary":"本卷常见漏洞在平移与旋转的辨认，以及7~9口诀求商的熟练度，注意同级运算从左往右的顺序。"},{"grade":2,"term":"下","stage":3,"stageName":"第二次月考","scope":"人教版二年级下第5~6单元：混合运算、有余数的除法（第二次月考进度）","questions":[{"q":"计算：5 + 3 × 2 = ？","a":"11","x":"先算乘法3×2=6，再算5+6=11。","v":"不理解先乘除后加减的运算顺序。"},{"q":"计算：(20 - 8) ÷ 4 = ？","a":"3","x":"有括号先算括号里的：20-8=12，12÷4=3。","v":"忘记括号里的要先算。"},{"q":"计算：18 - 12 ÷ 3 = ？","a":"14","x":"先算12÷3=4，再算18-4=14。","v":"先算减法后算除法，顺序错误。"},{"q":"计算：17 ÷ 5 = （　）余（　）","a":"3余2","x":"想口诀：三五十五，17-15=2，所以商3余2。","v":"有余数除法的商和余数求不准。"},{"q":"在有余数的除法里，余数必须比除数（　）。","a":"小","x":"余数如果等于或大于除数，说明还能再分，商就小了。","v":"不理解余数要比除数小的道理。"},{"q":"23个气球平均分给4个小朋友，每人分几个，还剩几个？","a":"每人5个，还剩3个","x":"23÷4=5余3，商是每人分到的，余数是剩下的。","v":"有余数除法应用题中商和余数含义分不清。"},{"q":"一本书30页，小丽每天看4页，看了7天，还剩几页没看？","a":"2页","x":"先算看了的：4×7=28页，再算30-28=2页。","v":"两步应用题不会先算中间量。"},{"q":"计算：4 × 6 ÷ 8 = ？","a":"3","x":"乘除同级，从左往右算：4×6=24，24÷8=3。","v":"同级运算从左往右的顺序没掌握。"}],"summary":"本卷常见漏洞在混合运算的顺序（先乘除后加减、括号优先）和有余数除法的余数处理。"},{"grade":2,"term":"下","stage":4,"stageName":"期末","scope":"人教版二年级下全册综合：重点是第7~9单元万以内数的认识、克和千克、数学广角——推理（期末进度）","questions":[{"q":"三千零六写作（　）。","a":"3006","x":"3个千和6个一，中间的百位、十位一个数也没有，要用0占位。","v":"中间有0的万以内数的写法易错。"},{"q":"4050是由（　）个千和（　）个十组成的？","a":"4个千、5个十","x":"千位是4就是4个千，十位是5就是5个十。","v":"对中间或末尾有0的数的组成理解不透。"},{"q":"在○里填上>、<或=：998 ○ 1002","a":"<","x":"998是三位数，1002是四位数，位数多的数大。","v":"不会先比位数再比数位来比较万以内的数。"},{"q":"1千克 = （　）克","a":"1000","x":"千克和克之间的进率是1000。","v":"千克与克的换算记不牢。"},{"q":"在括号里填上合适的单位：一个鸡蛋约重50（　）。","a":"克","x":"鸡蛋很轻，用克作单位合适。","v":"对克和千克的实际重量缺乏量感。"},{"q":"计算：6200 - 200 = ？","a":"6000","x":"62个百减2个百是60个百，就是6000。","v":"整百数的加减法不熟练。"},{"q":"一袋盐重500克，两袋盐一共重多少克？合几千克？","a":"1000克，合1千克","x":"500+500=1000克，1000克=1千克。","v":"克与千克的换算在应用中出错。"},{"q":"小红、小明、小刚三人比身高：小红比小明高，小明比小刚高。三人中谁最高？","a":"小红","x":"小红>小明>小刚，推理得出小红最高。","v":"不会用比较传递关系进行简单推理。"}],"summary":"本卷常见漏洞在万以内数的读写（中间有0）、克与千克的换算量感，以及简单的逻辑推理。"},{"grade":3,"term":"上","stage":1,"stageName":"第一次月考","scope":"第一、二单元：时、分、秒；万以内的加法和减法（一）","questions":[{"q":"分针从数字3走到数字8，一共走了多少分钟？","a":"25分钟","x":"分针走1大格是5分钟，从3到8走了5大格，5×5=25分钟。","v":"分针走一大格是5分钟这一基本换算不熟。"},{"q":"小明早上7:40从家出发，7:55到学校，路上用了多少分钟？","a":"15分钟","x":"同一小时内，用结束时刻减开始时刻：55-40=15分钟。","v":"计算经过时间（同一小时内直接相减）不熟。"},{"q":"1时=（ ）分，1分=（ ）秒。","a":"60分；60秒","x":"时、分、秒相邻两个单位之间的进率都是60。","v":"时间单位进率没记牢，容易和十进制进率混淆。"},{"q":"口算：32+45=？","a":"77","x":"先算30+40=70，再算2+5=7，70+7=77。","v":"两位数加法的拆分口算方法不熟。"},{"q":"口算：71-28=？","a":"43","x":"先算71-20=51，再算51-8=43。","v":"退位减法口算时容易漏减退位的1。"},{"q":"笔算：370+480=？","a":"850","x":"个位0+0=0，十位7+8=15写5进1，百位3+4+1=8，得850。","v":"连续进位加法容易漏加进上来的1。"},{"q":"笔算：620-350=？","a":"270","x":"个位0-0=0，十位2-5不够减向百位借1，12-5=7，百位6退1剩5，5-3=2，得270。","v":"十位不够减要向百位借位的退位减法不熟。"},{"q":"一部手机原价850元，商场降价90元，现在卖多少元？","a":"760元","x":"850-90=760元，可以想850-100=750，多减了10再加回来。","v":"整十数的减法在应用题中不会灵活计算。"}],"summary":"本卷主要漏洞集中在时间单位换算与经过时间计算、万以内加减法的进位退位处理上。"},{"grade":3,"term":"上","stage":2,"stageName":"期中","scope":"第一至四单元：时、分、秒；万以内的加减法；测量（毫米、分米、千米、吨）","questions":[{"q":"1千米=（ ）米，1米=（ ）分米。","a":"1000米；10分米","x":"千米和米之间进率是1000，米和分米之间进率是10。","v":"长度单位之间的进率记混。"},{"q":"在括号里填合适的单位：一支铅笔长约18（ ）；一头大象约重4（ ）。","a":"厘米；吨","x":"铅笔比较短用厘米，大象很重要用吨作单位。","v":"对常见物体的长度和质量缺少量感。"},{"q":"笔算：456+387=？","a":"843","x":"个位6+7=13写3进1，十位5+8+1=14写4进1，百位4+3+1=8，得843。","v":"连续进位加法容易漏加进上来的1。"},{"q":"笔算：803-576=？","a":"227","x":"个位13-6=7，十位借1后是10，再借1给个位剩9，9-7=2，百位8退1剩7，7-5=2，得227。","v":"中间有0的连续退位减法是明显难点。"},{"q":"计算：980-450+120=？","a":"650","x":"加减混合从左往右依次算：980-450=530，530+120=650。","v":"加减混合运算不按从左往右的顺序算。"},{"q":"一根绳子长2米5分米，用去8分米，还剩多少分米？","a":"17分米","x":"先把2米化成20分米，20+5=25分米，25-8=17分米。","v":"单位不统一就直接计算，要先统一单位再算。"},{"q":"3吨=（ ）千克。","a":"3000千克","x":"1吨=1000千克，3吨就是3个1000千克。","v":"吨与千克之间的进率（1000）没记牢。"},{"q":"小红家离学校900米，她每天从家到学校走一个来回，一天一共走多少米？","a":"1800米","x":"一个来回要走2趟，900×2=1800米。","v":"对“一个来回”的含义不理解，只算了一趟。"}],"summary":"期中阶段主要漏洞在测量单位换算与合理选单位、连续进位退位的加减法笔算上。"},{"grade":3,"term":"上","stage":3,"stageName":"第二次月考","scope":"第五、六单元：倍的认识；多位数乘一位数","questions":[{"q":"小鸡有6只，小鸭的只数是小鸡的4倍，小鸭有多少只？","a":"24只","x":"求一个数的几倍是多少用乘法：6×4=24只。","v":"“求一个数的几倍”该用乘法还是除法分不清。"},{"q":"甲数是45，正好是乙数的5倍，乙数是多少？","a":"9","x":"已知一个数的几倍是多少求这个数，用除法：45÷5=9。","v":"倍数关系的逆向题不会选除法。"},{"q":"口算：20×4=？ 300×6=？","a":"80；1800","x":"先算2×4=8再补一个0得80；先算3×6=18再补两个0得1800。","v":"整十、整百数乘一位数时积末尾0的个数写错。"},{"q":"笔算：213×4=？","a":"852","x":"3×4=12写2进1，1×4+1=5，2×4=8，得852。","v":"乘法一次进位容易漏进位。"},{"q":"笔算：265×3=？","a":"795","x":"5×3=15写5进1，6×3+1=19写9进1，2×3+1=7，得795。","v":"连续进位乘法容易漏进位或抄错数。"},{"q":"0乘任何数都得（ ）。照这样算：306×3=？","a":"0；918","x":"中间的0也要参与计算：6×3=18写8进1，0×3+1=1，3×3=9，得918。","v":"中间有0的三位数乘法容易把0跳过算错。"},{"q":"一个书包58元，买4个大约要带多少钱？估一估。","a":"大约240元","x":"把58看作60，60×4=240，估大一点更保险。","v":"不会用估算解决“带的钱够不够”的问题。"},{"q":"会议室有120个座位，来了3个班，每班42人，能全部坐下吗？","a":"坐不下","x":"先算总人数42×3=126人，126>120，所以坐不下。","v":"不会把乘法计算和比较大小结合起来解决实际问题。"}],"summary":"本卷主要漏洞是倍数关系分不清用乘法还是除法，以及多位数乘一位数的进位处理。"},{"grade":3,"term":"上","stage":4,"stageName":"期末","scope":"全册总复习，重点：多位数乘一位数、长方形和正方形的周长、分数的初步认识、数学广角——集合","questions":[{"q":"一个长方形长8厘米，宽5厘米，它的周长是多少厘米？","a":"26厘米","x":"长方形周长=(长+宽)×2=(8+5)×2=26厘米。","v":"周长公式记不全，只加了两条边或忘记乘2。"},{"q":"一个正方形的周长是36分米，它的边长是多少分米？","a":"9分米","x":"正方形边长=周长÷4，36÷4=9分米。","v":"正方形周长和边长的关系弄反了。"},{"q":"把一个西瓜平均分成8块，小明吃了3块，他吃了这个西瓜的几分之几？还剩几分之几？","a":"吃了3/8，还剩5/8","x":"平均分成8份，3份就是3/8；把1看作8/8，8/8-3/8=5/8。","v":"分数必须建立在“平均分”上；1化成分数再减不熟。"},{"q":"计算：1/4+2/4=？ 1-3/5=？","a":"3/4；2/5","x":"同分母分数相加，分子相加、分母不变；1看作5/5，5/5-3/5=2/5。","v":"把分母也相加，或不会把1化成同分母分数。"},{"q":"笔算：487×5=？","a":"2435","x":"7×5=35写5进3，8×5+3=43写3进4，4×5+4=24，得2435。","v":"连续进位乘法的熟练度不够。"},{"q":"三(1)班参加语文小组的有8人，参加数学小组的有6人，两个小组都参加的有2人，参加这两个小组的一共有多少人？","a":"12人","x":"8+6-2=12人，两项都参加的2人只能算一次。","v":"集合问题中重叠部分被重复计算。"},{"q":"估一估：398×6的积大约是多少？","a":"大约2400","x":"把398看作400，400×6=2400。","v":"估算时不会把数看成接近的整百数。"},{"q":"一辆汽车每小时行80千米，行了5小时，一共行了多少千米？","a":"400千米","x":"每小时行的路×小时数=总路程，80×5=400千米。","v":"速度×时间=路程这一基本数量关系不熟。"}],"summary":"期末主要漏洞集中在周长与面积类图形公式、分数的初步认识（平均分与同分母加减）、集合重叠问题和乘法进位上。"},{"grade":3,"term":"下","stage":1,"stageName":"第一次月考","scope":"第一、二单元：位置与方向（一）；除数是一位数的除法","questions":[{"q":"早晨面向太阳，你的前面是（ ），后面是（ ）。","a":"东；西","x":"太阳从东方升起，面向太阳就是面向东，东和西相对。","v":"八个基本方向中东西相对、南北相对的关系不熟。"},{"q":"地图通常是按上（ ）、下（ ）、左（ ）、右（ ）绘制的。","a":"北、南、西、东","x":"地图的规定是“上北下南，左西右东”。","v":"地图方向的规定没记住。"},{"q":"口算：60÷3=？ 800÷4=？","a":"20；200","x":"6个十除以3得2个十是20；8个百除以4得2个百是200。","v":"整十、整百数除以一位数的口算不熟。"},{"q":"笔算：84÷4=？","a":"21","x":"十位8÷4商2，个位4÷4商1，商的每一位要和被除数对应数位对齐。","v":"商的数位和被除数对不齐。"},{"q":"笔算：238÷6=？","a":"39……4","x":"百位2除以6不够商1，看前两位：23÷6=3余5，落下8变成58，58÷6=9余4。","v":"首位不够商1要看前两位的规则不熟。"},{"q":"验算：415÷7=59……2，这个结果对吗？","a":"对","x":"用商×除数+余数验算：59×7=413，413+2=415，正确。","v":"不会用“商×除数+余数”验算有余数的除法。"},{"q":"0除以任何不是0的数都得（ ）。","a":"0","x":"比如0÷5=0；但要注意0不能作除数。","v":"对0在除法中的特殊规定不清楚。"},{"q":"三年级同学去春游，男生132人，女生116人，如果每4人分一组，一共可以分成多少组？","a":"62组","x":"先算总人数132+116=248人，再248÷4=62组。","v":"两步应用题（先加后除）不会列综合算式。"}],"summary":"本卷主要漏洞在方向的辨认规则和除数是一位数除法的试商、验算上。"},{"grade":3,"term":"下","stage":2,"stageName":"期中","scope":"第一至四单元：位置与方向（一）、除数是一位数的除法、复式统计表、两位数乘两位数（口算）","questions":[{"q":"小林面向北，他的左面是（ ），右面是（ ）。","a":"西；东","x":"面向北时按“上北下南左西右东”判断，左手边是西，右手边是东。","v":"已知一个方向判断其余三个方向不熟。"},{"q":"口算：32×30=？","a":"960","x":"先算32×3=96，再在末尾补一个0，得960。","v":"两位数乘整十数口算时积末尾0的个数出错。"},{"q":"笔算：132÷3=？","a":"44","x":"百位1除以3不够商1，看前两位13÷3=4余1，落下2变成12，12÷3=4，得44。","v":"首位不够商1时商的定位不熟。"},{"q":"笔算：612÷6=？","a":"102","x":"百位6÷6=1，十位1÷6不够商1要商0占位，落下2变成12，12÷6=2，得102。","v":"商中间有0的除法容易漏写0。"},{"q":"笔算：246÷8=？","a":"30……6","x":"8×30=240，246-240=6，余数6比除数8小，商30余6。","v":"试商后余数比除数大时不会调整商。"},{"q":"估一估：483÷6的商大约是多少？","a":"大约80","x":"把483看作480，480÷6=80。","v":"不会用估算把被除数看成接近的整十整百数。"},{"q":"复式统计表里，男生喜欢跳绳的有12人，女生喜欢跳绳的有9人，喜欢跳绳的一共有多少人？","a":"21人","x":"把男生、女生两栏的数据合起来：12+9=21人。","v":"不会从复式统计表中读取并合并两栏数据。"},{"q":"每个班要发15本练习本，20个班一共要发多少本？","a":"300本","x":"15×20：先算15×2=30，再补一个0得300本。","v":"两位数乘整十数的口算方法不熟。"}],"summary":"期中主要漏洞是商中间或末尾有0的除法、试商与验算习惯，以及复式统计表数据的读取合并。"},{"grade":3,"term":"下","stage":3,"stageName":"第二次月考","scope":"第四、五单元：两位数乘两位数；面积","questions":[{"q":"笔算：23×12=？","a":"276","x":"先算23×2=46，再算23×10=230，46+230=276。","v":"用第二个因数十位上的数去乘时，部分积的末位要对齐十位，这一步常出错。"},{"q":"笔算：45×36=？","a":"1620","x":"45×6=270，45×30=1350，270+1350=1620。","v":"两个部分积相加时算错或数位没对齐。"},{"q":"估算：62×29的积大约是多少？","a":"大约1800","x":"把62看作60，29看作30，60×30=1800。","v":"不会把两个因数都看成整十数来估算。"},{"q":"常用的面积单位有（ ）、（ ）、（ ）。","a":"平方厘米、平方分米、平方米","x":"注意厘米是长度单位，平方厘米才是面积单位。","v":"长度单位和面积单位混淆。"},{"q":"1平方分米=（ ）平方厘米；5平方米=（ ）平方分米。","a":"100；500","x":"相邻面积单位之间的进率是100：1平方米=100平方分米。","v":"面积单位进率100没记牢，容易和长度单位进率混淆。"},{"q":"一个长方形花坛长6米、宽4米，它的面积是多少？周长是多少？","a":"面积24平方米；周长20米","x":"面积=长×宽=6×4=24；周长=(长+宽)×2=(6+4)×2=20。","v":"面积公式和周长公式混淆。"},{"q":"一块正方形手帕边长3分米，它的面积是多少平方分米？合多少平方厘米？","a":"9平方分米；900平方厘米","x":"3×3=9平方分米；9×100=900平方厘米。","v":"面积计算和单位换算连起来用时容易出错。"},{"q":"教室地面长8米、宽7米，用面积是2平方分米的方砖铺地，一共需要多少块？","a":"2800块","x":"8×7=56平方米=5600平方分米，5600÷2=2800块。","v":"不会用大面积÷小面积求块数，且容易漏换算单位。"}],"summary":"本卷主要漏洞是两位数乘两位数笔算的数位对齐，以及面积单位换算和周长面积公式混淆。"},{"grade":3,"term":"下","stage":4,"stageName":"期末","scope":"全册总复习，重点：面积、年月日、小数的初步认识、数学广角——搭配（二）","questions":[{"q":"一年有（ ）个月，其中大月有（ ）个，大月每月有31天。","a":"12个月；7个","x":"大月是1、3、5、7、8、10、12月，一共7个。","v":"大月、小月分别是哪几个月记不全。"},{"q":"平年2月有（ ）天，全年（ ）天；闰年全年（ ）天。","a":"28天；365天；366天","x":"平年2月28天，闰年2月29天，多1天所以闰年全年366天。","v":"平年和闰年的区别不熟。"},{"q":"2024年是平年还是闰年？","a":"闰年","x":"用年份除以4：2024÷4=506没有余数，是闰年。","v":"判断平年闰年的方法（除以4看余数）不会用。"},{"q":"0.5元=（ ）角；1.2米=（ ）米（ ）分米。","a":"5角；1米2分米","x":"0.5元就是5角；1.2米的整数部分是1米，0.2米是2分米。","v":"小数与元角分、长度单位的互化不熟。"},{"q":"比较大小：0.7（ ）0.9；3.1（ ）2.9。（填＞、＜或＝）","a":"＜；＞","x":"先比整数部分，整数部分相同再比小数部分。","v":"小数比大小的方法不熟，误以为小数部分长的数大。"},{"q":"计算：0.6+0.3=？ 1.5-0.8=？","a":"0.9；0.7","x":"小数点对齐再加减；1.5-0.8不够减时向整数位退1。","v":"小数加减时没有把小数点对齐。"},{"q":"用1、2、3三张数字卡片，可以组成多少个没有重复数字的两位数？","a":"6个","x":"十位有3种选法，个位从剩下2个数里选，3×2=6个：12、13、21、23、31、32。","v":"搭配问题不会按顺序枚举，容易重复或遗漏。"},{"q":"一块长方形菜地长9米、宽6米，其中一半种白菜，种白菜的面积是多少？","a":"27平方米","x":"先算整块地面积9×6=54平方米，再54÷2=27平方米。","v":"求部分面积时不会先算整体再平均分。"}],"summary":"期末主要漏洞集中在年月日与平年闰年判断、小数意义与大小比较、搭配枚举的有序性上。"},{"grade":4,"term":"上","stage":1,"stageName":"第一次月考","scope":"第一、二单元：大数的认识；公顷和平方千米","questions":[{"q":"读数：30800090 读作什么？","a":"三千零八十万零九十","x":"先分级：万级3080，个级0090；每级中间连续的0只读一个零。","v":"大数中间的0的读法不准。"},{"q":"写数：五亿零六千 写作什么？","a":"500006000","x":"亿级写5，万级没有单位要补0000，个级写6000。","v":"哪一级没有单位时要补0占位不清楚。"},{"q":"一个数由6个百万和4个千组成，这个数是多少？","a":"6004000","x":"百万位写6，千位写4，其余数位都写0。","v":"数位顺序表不熟，数位对位出错。"},{"q":"把890000改写成用“万”作单位的数；把1200000000改写成用“亿”作单位的数。","a":"89万；12亿","x":"改写只去掉末尾的0再加单位：去4个0加“万”，去8个0加“亿”。","v":"改写时末尾0的个数数错。"},{"q":"把2945000省略万位后面的尾数，求它的近似数。","a":"295万","x":"看省略位（万位）的后一位（千位），千位是5，满5向万位进1，约是295万。","v":"四舍五入时看错该看的数位。"},{"q":"比较大小：99800（ ）100010。（填＞、＜或＝）","a":"＜","x":"先比位数：100010是六位数，99800是五位数，位数多的数大。","v":"不会先比位数再逐位比较。"},{"q":"1公顷=（ ）平方米；1平方千米=（ ）公顷。","a":"10000平方米；100公顷","x":"边长100米的正方形面积是1公顷，即10000平方米。","v":"公顷、平方千米与平方米之间的进率记混。"},{"q":"一块菜地的面积约5000平方米，2块这样大的菜地面积约是多少公顷？","a":"1公顷","x":"5000×2=10000平方米，10000平方米=1公顷。","v":"不会通过换算把平方米和公顷联系起来。"}],"summary":"本卷主要漏洞是大数的读写（中间补0、0的读法）、改写与四舍五入的区别，以及土地面积单位换算。"},{"grade":4,"term":"上","stage":2,"stageName":"期中","scope":"第一至三单元：大数的认识、公顷和平方千米、角的度量","questions":[{"q":"一个数由5个千万和8个万组成，这个数是多少？","a":"50080000","x":"千万位写5，万位写8，其余数位写0。","v":"多级数中间补0占位出错。"},{"q":"把6320000改写成用“万”作单位的数。","a":"632万","x":"去掉末尾4个0，再加“万”字，数的大小不变。","v":"把“改写”和“省略尾数（四舍五入）”混为一谈。"},{"q":"“一条射线长5厘米”这句话对吗？","a":"不对","x":"射线只有一个端点，向一端无限延伸，不能度量长度。","v":"线段、射线、直线的特征混淆。"},{"q":"角的大小和什么有关？","a":"和两条边叉开的大小有关，与边的长短无关","x":"角的两边是射线，边画得长不代表角大。","v":"认为边画得长角就大，是典型误区。"},{"q":"1周角=（ ）个平角=（ ）个直角。","a":"2；4","x":"1周角=360°，1平角=180°，1直角=90°，360°=2×180°=4×90°。","v":"周角、平角、直角之间的关系没记牢。"},{"q":"钝角一定大于（ ）度而小于（ ）度。","a":"90；180","x":"钝角的范围是大于90°且小于180°。","v":"锐角、钝角、直角的分类范围记不清。"},{"q":"用量角器量角时，角的顶点要对准量角器的（ ），角的一条边要对准（ ）。","a":"中心；0刻度线","x":"先“点对点、边对边”，再读另一条边所对的刻度。","v":"量角器使用方法不对，导致读数偏差。"},{"q":"3公顷=（ ）平方米。","a":"30000平方米","x":"1公顷=10000平方米，3公顷就是3个10000平方米。","v":"公顷与平方米的进率记混。"}],"summary":"期中主要漏洞在大数的改写与求近似数、射线直线角的概念辨析和量角器的规范使用上。"},{"grade":4,"term":"上","stage":3,"stageName":"第二次月考","scope":"第四、五单元：三位数乘两位数；平行四边形和梯形","questions":[{"q":"笔算：145×12=？","a":"1740","x":"145×2=290，145×10=1450，290+1450=1740。","v":"用十位上的数乘时，部分积末位没有对齐十位。"},{"q":"笔算：207×34=？","a":"7038","x":"207×4=828，207×30=6210，828+6210=7038。","v":"中间有0的三位数乘法容易算错。"},{"q":"估算：198×21的积大约是多少？","a":"大约4000","x":"198≈200，21≈20，200×20=4000。","v":"不会把两个因数都看成整十整百数来估算。"},{"q":"一辆汽车每小时行85千米，它的速度可以记作（ ）。","a":"85千米/时","x":"速度用复合单位表示：路程单位/时间单位，读作“85千米每小时”。","v":"速度的复合单位写法不熟。"},{"q":"一列火车每小时行120千米，行了12小时，一共行了多少千米？","a":"1440千米","x":"速度×时间=路程，120×12=1440千米。","v":"路程问题的基本数量关系不熟。"},{"q":"两组对边分别平行的四边形叫（ ）；只有一组对边平行的四边形叫（ ）。","a":"平行四边形；梯形","x":"两组对边平行的是平行四边形，只有一组对边平行的是梯形。","v":"平行四边形和梯形的定义混淆。"},{"q":"长方形是特殊的平行四边形吗？为什么？","a":"是","x":"长方形的两组对边也分别平行，还多一个“四个角都是直角”的特点，所以是特殊的平行四边形。","v":"图形之间的包含关系不清楚。"},{"q":"平行四边形容易变形，生活中利用这个特性的物品有哪些？（举一例）","a":"伸缩门（或升降晾衣架等）","x":"平行四边形具有不稳定性、容易变形，伸缩门正是利用了这一点。","v":"不知道平行四边形容易变形（不稳定性）的特性。"}],"summary":"本卷主要漏洞是三位数乘两位数的笔算与估算、速度单位写法，以及平行四边形和梯形的概念辨析。"},{"grade":4,"term":"上","stage":4,"stageName":"期末","scope":"全册总复习，重点：除数是两位数的除法、条形统计图、数学广角——优化，兼顾大数与角的复习","questions":[{"q":"口算：240÷30=？","a":"8","x":"想乘法：30×8=240，所以商8；也可以看作24÷3=8。","v":"整十数除整十数的口算不熟。"},{"q":"笔算：816÷34=？","a":"24","x":"把34看作30试商：81÷34商2，81-68=13，落下6变成136，136÷34=4，得24。","v":"试商、调商的过程不熟练。"},{"q":"笔算：730÷26=？","a":"28……2","x":"26×28=728，730-728=2，余数2小于除数26。","v":"试商时余数比除数大不会调整商。"},{"q":"商不变的性质：被除数和除数同时乘或除以一个相同的数（0除外），商（ ）。","a":"不变","x":"例如80÷16，被除数和除数同时除以8，变成10÷2，商还是5。","v":"商不变的性质没有掌握。"},{"q":"计算：900÷40=？","a":"22……20","x":"用商不变性质90÷4=22余2，但被除数和除数同时除了10，余数也缩小了10倍，所以原来的余数是20。","v":"用商不变性质简算时，误把余数也当成“不变”写成余2。"},{"q":"条形统计图中一格代表5人，喜欢跳绳的直条有6格，喜欢跳绳的有多少人？","a":"30人","x":"一格5人，6格就是5×6=30人。","v":"不会根据“每格代表几”读条形统计图。"},{"q":"妈妈烙饼，锅里一次只能烙2张，每面要烙3分钟，烙3张饼最少要多少分钟？","a":"9分钟","x":"3张饼共6个面，每次锅里最多烙2个面，至少烙3次，3×3=9分钟（三张饼轮流烙）。","v":"不会统筹安排时间，不懂优化问题。"},{"q":"1平角=（ ）个直角；一个五位数，它的最高位是（ ）位。","a":"2；万","x":"平角是180°，正好是2个90°；五位数最高位是万位。","v":"前面单元的基础概念（角的关系、数位顺序）遗忘。"}],"summary":"期末主要漏洞在除数是两位数除法的试商调商、商不变性质中余数的变化，以及优化问题的统筹思路。"},{"grade":4,"term":"下","stage":1,"stageName":"第一次月考","scope":"第一、二单元：四则运算；观察物体（二）","questions":[{"q":"计算：120-60÷12","a":"115","x":"先算除法60÷12=5，再算120-5=115。","v":"四则运算顺序不清，容易先算减法。"},{"q":"计算：(256+144)÷8","a":"50","x":"先算括号里的256+144=400，再算400÷8=50。","v":"忘了先算小括号里面的。"},{"q":"一个数加上0还得（ ）；0除以一个不为0的数得（ ）；0不能作（ ）。","a":"原数；0；除数","x":"0加任何数都得原数；0除以不为0的数得0；0不能作除数。","v":"0的特殊运算规定记不住，尤其是0不能作除数。"},{"q":"把96÷12=8和8+32=40合成一个综合算式。","a":"96÷12+32=40","x":"先算的除法写在前面，按“先乘除后加减”顺序正好成立。","v":"不会根据运算顺序把分步算式合成综合算式。"},{"q":"计算：800÷(16×5)","a":"10","x":"先算括号里16×5=80，再算800÷80=10。","v":"括号内两级运算没算完就去除。"},{"q":"用4个同样大的小正方体拼成横着一排的物体，从上面看和从前面看到的形状一样吗？","a":"一样，都是一行4个正方形","x":"单排摆放的物体，从前面和从上面看到的都是一横行4个正方形。","v":"从不同方向观察物体的方向区分不清。"},{"q":"从不同方向观察同一个物体，看到的形状一定不同吗？","a":"不一定，可能相同","x":"比如正方体从各个方向看都是正方形；单排摆放的物体从前面和上面看也一样。","v":"误以为不同方向看到的形状一定不同。"},{"q":"18×6+4要先算加法，算式应写成（ ）。","a":"18×(6+4)","x":"加小括号可以改变“先乘除后加减”的运算顺序。","v":"不会用小括号改变运算顺序。"}],"summary":"本卷主要漏洞是四则混合运算的顺序（含小括号）和0的特殊规定，以及三视图的观察方向。"},{"grade":4,"term":"下","stage":2,"stageName":"期中","scope":"第一至三单元：四则运算、观察物体（二）、运算定律","questions":[{"q":"用简便方法计算：25×44","a":"1100","x":"25×4=100，所以25×44=25×4×11=1100。","v":"不会拆数凑整使用乘法结合律。"},{"q":"简便计算：102×45","a":"4590","x":"把102看作100+2，用乘法分配律：100×45+2×45=4500+90=4590。","v":"乘法分配律不会用于接近整百的数。"},{"q":"简便计算：378+159+22","a":"559","x":"先用378+22凑成400（加法交换律和结合律），再加159得559。","v":"凑整意识不强，看到题就按顺序硬算。"},{"q":"简便计算：864-197","a":"667","x":"197接近200，先算864-200=664，多减了3再加回来：664+3=667。","v":"减去接近整百的数时忘记加回多减的部分。"},{"q":"简便计算：125×32","a":"4000","x":"把32拆成8×4，125×8=1000，1000×4=4000。","v":"不会把一个因数拆成两个数，用结合律凑整。"},{"q":"45×38=38×45，这里用了什么运算定律？","a":"乘法交换律","x":"两个数相乘，交换因数的位置，积不变。","v":"交换律和结合律分不清。"},{"q":"简便计算：56×101-56","a":"5600","x":"56×101-56=56×(101-1)=56×100=5600，这是逆用乘法分配律。","v":"不会逆用乘法分配律提取公因数。"},{"q":"加法结合律用字母表示是（ ）。","a":"(a+b)+c=a+(b+c)","x":"三个数相加，先把前两个数相加或先把后两个数相加，和不变。","v":"运算定律的字母表达式记不住。"}],"summary":"期中主要漏洞在运算定律的识别与运用（尤其是分配律及逆用）和凑整简算的意识上。"},{"grade":4,"term":"下","stage":3,"stageName":"第二次月考","scope":"第四、五单元：小数的意义和性质；三角形","questions":[{"q":"0.35里面有（ ）个0.01。","a":"35","x":"0.35的计数单位是0.01，它表示35个百分之一。","v":"小数的计数单位和进率不清楚。"},{"q":"把4.06的小数点向右移动两位，这个数扩大到原来的多少倍？变成了多少？","a":"100倍；406","x":"小数点向右移动两位，相当于把原数乘100。","v":"小数点移动引起大小变化的规律记反或记错位数。"},{"q":"化简小数：3.50=（ ） 0.300=（ ）","a":"3.5；0.3","x":"根据小数的性质，小数末尾去掉0（或添上0），大小不变。","v":"把“末尾的0”和“中间的0”混淆，去错了0。"},{"q":"把7.945保留两位小数是多少？保留一位小数呢？","a":"7.95；7.9","x":"保留两位看千分位5，满5进1得7.95；保留一位看百分位4，不满5舍去得7.9。","v":"四舍五入时看错了该看的数位。"},{"q":"三角形按角分类可以分为（ ）、（ ）、（ ）。","a":"锐角三角形、直角三角形、钝角三角形","x":"三个角都是锐角、有一个直角、有一个钝角，分别对应三类。","v":"三角形按角分类的标准不清。"},{"q":"三角形的内角和是（ ）度；一个直角三角形中一个锐角是35度，另一个锐角是（ ）度。","a":"180；55","x":"180-90-35=55度，用内角和180°求第三个角。","v":"内角和180°没记住，或不会用它求未知角。"},{"q":"三根小棒长分别是3厘米、4厘米、8厘米，能围成三角形吗？","a":"不能","x":"3+4=7，小于第三边8，两边之和必须大于第三边才能围成三角形。","v":"三角形三边关系（两边之和大于第三边）不熟。"},{"q":"一个等腰三角形顶角是100度，它的一个底角是多少度？","a":"40度","x":"两个底角相等，(180-100)÷2=40度。","v":"等腰三角形两个底角相等的关系不清。"}],"summary":"本卷主要漏洞是小数的计数单位、小数点移动规律、求小数近似数，以及三角形三边关系和内角和。"},{"grade":4,"term":"下","stage":4,"stageName":"期末","scope":"全册总复习，重点：小数的加法和减法、图形的运动（二）、平均数、数学广角——鸡兔同笼","questions":[{"q":"计算：5.6+2.47","a":"8.07","x":"小数点对齐：5.60+2.47=8.07。","v":"小数位数不同时没有先对齐小数点。"},{"q":"计算：10-4.82","a":"5.18","x":"把10写成10.00，像整数减法一样逐位退位减，得5.18。","v":"整数减小数不会补0退位。"},{"q":"简便计算：6.9+4.8+3.1","a":"14.8","x":"6.9+3.1=10（加法交换律凑整），10+4.8=14.8。","v":"小数加法不会凑整简算。"},{"q":"简便计算：18.5-3.7-6.3","a":"8.5","x":"3.7+6.3=10，18.5-10=8.5；减去两个数等于减去它们的和。","v":"减法的运算性质不会用到小数里。"},{"q":"四(1)班第一小组5名同学的身高分别是136、138、140、142、144厘米，平均身高是多少厘米？","a":"140厘米","x":"先求总和136+138+140+142+144=700，再700÷5=140厘米。","v":"平均数=总数÷份数这一关系不熟。"},{"q":"一个图形沿一条直线对折后两边完全重合，这个图形叫（ ）图形，这条直线叫（ ）。","a":"轴对称；对称轴","x":"对折后完全重合是轴对称图形的本质特征。","v":"轴对称图形和对称轴的概念不清。"},{"q":"鸡兔同笼：共有8个头，26条腿，鸡和兔各有几只？","a":"鸡3只，兔5只","x":"假设全是鸡：8×2=16条腿，26-16=10，每只兔比鸡多2条腿，10÷2=5只兔，鸡8-5=3只。","v":"不会用假设法解鸡兔同笼问题。"},{"q":"图形平移后，不改变它的（ ）和（ ），只改变位置。","a":"形状；大小","x":"平移是把图形整体移动，形状、大小都不变。","v":"平移的性质不熟，误以为平移会改变图形。"}],"summary":"期末主要漏洞在小数加减法对位与退位、简便运算的迁移、平均数求法、假设法解鸡兔同笼上。"},{"grade":5,"term":"上","stage":1,"stageName":"第一次月考","scope":"人教版五年级上册第一、二单元：小数乘法、位置","questions":[{"q":"直接写出得数：0.25×4=","a":"1","x":"25×4=100，两个因数共3位小数，0.100=1。","v":"小数乘法中确定积的小数位数（数因数里共有几位小数）不熟。"},{"q":"竖式计算：1.25×0.8=","a":"1","x":"先算125×8=1000，两个因数共3位小数，点出小数点是1.000，即1。","v":"积末尾有0时忘记先点小数点再化简，小数点定位出错。"},{"q":"简便计算：2.5×3.2×4","a":"32","x":"用乘法交换律：2.5×4=10，10×3.2=32。","v":"不会灵活运用乘法交换律、结合律凑整十进行简算。"},{"q":"计算 0.86×1.4，结果保留两位小数。","a":"约1.20","x":"0.86×1.4=1.204，四舍五入后是1.20。","v":"求积的近似数时四舍五入规则或保留位数要求掌握不牢。"},{"q":"苹果每千克5.6元，买2.5千克应付多少元？","a":"14元","x":"5.6×2.5=14（元）。","v":"用小数乘法解决购物问题时列式或计算出错。"},{"q":"电价每千瓦时0.52元，小张家上月用电85千瓦时，应付电费多少元？","a":"44.2元","x":"0.52×85=44.2（元）。","v":"小数乘整数时积的小数点位置点错。"},{"q":"小明的座位用数对(3,4)表示，即第3列第4行。他右边相邻同学（同一行）的座位用数对怎么表示？","a":"(4,4)","x":"同一行行数不变，向右列数加1，所以是(4,4)。","v":"数对中第一个数表示列、第二个数表示行，'先列后行'没记住或平移时该变哪个数不清楚。"},{"q":"淘气在第4列第6行，用数对(4,6)表示；数对(2,6)表示的同学和他是什么位置关系？","a":"同一行（都在第6行）","x":"两个数对第二个数相同，说明行相同，只是列不同。","v":"看不出数对中两个数分别对应列与行，不会通过数对判断位置关系。"}],"summary":"本阶段最常见漏洞是积的小数点定位和数对'先列后行'的规则，简便运算的凑整意识也要加强。"},{"grade":5,"term":"上","stage":2,"stageName":"期中","scope":"人教版五年级上册第一至四单元：小数乘法、位置、小数除法、可能性","questions":[{"q":"计算：7.65÷0.85=","a":"9","x":"把除数变成整数：7.65÷0.85=765÷85=9。","v":"小数除法中商不变性质的运用不熟，移动小数点位数不一致。"},{"q":"计算：5.2÷0.4=","a":"13","x":"5.2÷0.4=52÷4=13。","v":"被除数和除数要同时扩大相同的倍数，只移一边就出错。"},{"q":"计算 10÷3，商用循环小数表示，它的循环节是几？","a":"3.33…，循环节是3","x":"10÷3=3.333…，不断重复的数字3就是循环节。","v":"循环小数、循环节的概念不清。"},{"q":"做一套衣服用布2.4米，现有17米布，最多能做几套衣服？","a":"7套","x":"17÷2.4≈7.08，剩下的布不够再做一套，用去尾法取7套。","v":"该用去尾法还是进一法分不清，机械四舍五入。"},{"q":"每个油壶最多装4.5千克油，要装完40千克油至少需要几个油壶？","a":"9个","x":"40÷4.5≈8.89，装不满的也要用一个壶，用进一法取9个。","v":"进一法、去尾法的实际意义理解不到位。"},{"q":"计算：1.08×2.5=","a":"2.7","x":"108×25=2700，共3位小数，得2.700，化简为2.7。","v":"积末尾的0化简与小数点定位顺序易错。"},{"q":"盒子里有5个红球和2个白球（除颜色外完全相同），任意摸出一个，摸出哪种颜色球的可能性大？","a":"红球","x":"红球个数多，摸出红球的可能性大。","v":"可能性大小与数量的关系不理解。"},{"q":"掷一枚骰子，掷出的点数小于4的可能性大，还是大于4的可能性大？","a":"小于4的可能性大","x":"小于4的点有1、2、3共3种，大于4的只有5、6共2种，3种比2种可能性大。","v":"不会通过列举所有等可能结果来比较可能性大小。"}],"summary":"小数除法转成整数除法后小数点的位置、进一法与去尾法的取舍是本阶段最常见漏洞。"},{"grade":5,"term":"上","stage":3,"stageName":"第二次月考","scope":"人教版五年级上册第五单元：简易方程（含前面单元复习）","questions":[{"q":"每支钢笔a元，买6支要花多少元？付出50元应找回多少元？（用含字母的式子表示）","a":"6a元；找回(50-6a)元","x":"总价=单价×数量即6a；找回=付出-花费即50-6a。","v":"用字母表示数量关系不熟，含字母的式子书写不规范。"},{"q":"解方程：x+3.5=10","a":"x=6.5","x":"两边同时减3.5，x=10-3.5=6.5。","v":"等式的基本性质运用不熟，移项时符号出错。"},{"q":"解方程：3x-6=18","a":"x=8","x":"两边先加6得3x=24，再同时除以3，x=8。","v":"解方程的顺序混乱，先加减还是先乘除理不清。"},{"q":"解方程：4(x-1.5)=12","a":"x=4.5","x":"两边同时除以4得x-1.5=3，再加1.5，x=4.5。","v":"含括号的方程不会先去括号或整体处理，步骤出错。"},{"q":"当a=2.5，b=1.2时，求式子4a-2b的值。","a":"7.6","x":"4×2.5=10，2×1.2=2.4，10-2.4=7.6。","v":"把字母的值代入式子时运算顺序或小数计算出错。"},{"q":"小明买3支同样的笔付了12元，找回1.5元，每支笔多少元？（列方程解答）","a":"3.5元","x":"设每支x元，列方程3x=12-1.5（或3x+1.5=12），3x=10.5，x=3.5。","v":"不会从实际情境中找等量关系列方程。"},{"q":"图书角原来有x本书，借出24本又买来18本，现在有56本。原来有多少本？（列方程解答）","a":"62本","x":"x-24+18=56，x-6=56，x=62。","v":"逆推类问题列方程时运算关系写错，或解方程粗心。"},{"q":"6x＞12 是方程吗？为什么？","a":"不是，因为它不是等式","x":"方程必须是含有未知数的等式，6x＞12虽然含未知数但不相等。","v":"方程的两个条件（含未知数、是等式）掌握不全。"}],"summary":"解方程要紧扣等式的性质，列方程先找准等量关系，这两点不熟是本阶段主要漏洞。"},{"grade":5,"term":"上","stage":4,"stageName":"期末","scope":"人教版五年级上册全册：含第六单元多边形的面积、第七单元植树问题及全册综合","questions":[{"q":"一个平行四边形，底6厘米，高4厘米，面积是多少平方厘米？","a":"24平方厘米","x":"平行四边形面积=底×高=6×4=24。","v":"平行四边形面积公式记错（如误乘2），或底高不对应。"},{"q":"一个三角形，底8厘米，高5厘米，面积是多少平方厘米？","a":"20平方厘米","x":"三角形面积=底×高÷2=8×5÷2=20。","v":"三角形、梯形面积忘记除以2。"},{"q":"一个梯形，上底4厘米，下底10厘米，高6厘米，面积是多少平方厘米？","a":"42平方厘米","x":"(4+10)×6÷2=14×6÷2=42。","v":"梯形面积公式(上底+下底)×高÷2记不清。"},{"q":"一块平行四边形菜地，底25米，高16米，这块菜地的面积是多少平方米？","a":"400平方米","x":"25×16=400（平方米）。","v":"用面积公式解决实际问题时计算出错。"},{"q":"一条路长100米，每隔5米栽一棵树（两端都栽），一共要栽多少棵？","a":"21棵","x":"间隔数=100÷5=20，两端都栽棵数=间隔数+1=21。","v":"植树问题中'棵数=间隔数+1'（两端都栽）的规律不熟。"},{"q":"圆形池塘周长120米，沿池塘每隔8米栽一棵树，一共要栽多少棵？","a":"15棵","x":"封闭图形上植树，棵数=间隔数=120÷8=15。","v":"封闭图形植树不加1，与线段两端都栽的情况混淆。"},{"q":"解方程：2.5x+3=10.5","a":"x=3","x":"两边先减3得2.5x=7.5，再除以2.5，x=3。","v":"解方程步骤不熟练，小数运算出错。"},{"q":"计算：13.5÷0.45=","a":"30","x":"13.5÷0.45=1350÷45=30。","v":"除数是小数时商不变性质运用出错。"}],"summary":"多边形面积公式要记清并注意别忘除以2，植树问题先分清两端都栽、一端栽、封闭图形三种情况。"},{"grade":5,"term":"下","stage":1,"stageName":"第一次月考","scope":"人教版五年级下册第一、二单元：观察物体（三）、因数与倍数","questions":[{"q":"写出24的所有因数。","a":"1、2、3、4、6、8、12、24","x":"一对一对找：1×24、2×12、3×8、4×6。","v":"找一个数的因数时会遗漏或重复。"},{"q":"写出6的3个倍数。","a":"6、12、18（答案不唯一，如6、12、18、24……）","x":"6×1、6×2、6×3……依次是6的倍数。","v":"因数（有限个）与倍数（无限个）的概念混淆。"},{"q":"在35□的□里填一个数字，使这个数是3的倍数，□里最小填几？","a":"1","x":"3的倍数各数位数字之和是3的倍数：3+5+d=8+d，d最小取1得9。","v":"2、3、5的倍数的特征没有掌握，尤其3的倍数看数字和。"},{"q":"写出20以内（不含20）的全部质数。","a":"2、3、5、7、11、13、17、19","x":"质数只有1和它本身两个因数，1既不是质数也不是合数。","v":"质数、合数概念不清，容易把1当成质数或漏掉2。"},{"q":"5个奇数相加，和是奇数还是偶数？","a":"奇数","x":"两个奇数的和是偶数，偶数加奇数还是奇数，5个（奇数个）奇数之和为奇数。","v":"奇偶数的运算规律（奇+奇=偶，偶+奇=奇）不熟。"},{"q":"一个数既是6的倍数，又是48的因数，这个数可能是多少？","a":"6、12、24、48","x":"48的因数中是6的倍数的有：6、12、24、48。","v":"不会同时用因数和倍数两个条件筛选数。"},{"q":"把4个同样大的小正方体拼成一行（拼成一个长方体），从正面看能看到几个小正方形？","a":"4个","x":"拼成一行后，正面正好是一行4个正方形。","v":"观察物体时不会想象从指定方向看到的平面形状。"},{"q":"从不同的方向观察同一个立体图形，看到的形状一定不同吗？","a":"不一定，可能相同","x":"比如一个正方体，从前面、上面、左面看到的都是一个正方形。","v":"对'从不同方向看到的形状可能相同也可能不同'理解不到位。"}],"summary":"因数与倍数要分清'因数有限、倍数无限'，质数合数、奇偶性判断和2、3、5倍数特征易混易漏。"},{"grade":5,"term":"下","stage":2,"stageName":"期中","scope":"人教版五年级下册第一至三单元：观察物体（三）、因数与倍数、长方体和正方体","questions":[{"q":"一个长方体，长5厘米、宽3厘米、高2厘米，它的棱长总和是多少厘米？","a":"40厘米","x":"长方体有4组长宽高，(5+3+2)×4=40（厘米）。","v":"长方体棱长总和公式(长+宽+高)×4记不清。"},{"q":"接上题，这个长方体的表面积是多少平方厘米？","a":"62平方厘米","x":"(5×3+5×2+3×2)×2=(15+10+6)×2=62。","v":"表面积公式中三类面各乘2易漏乘或算错面。"},{"q":"接上题，这个长方体的体积是多少立方厘米？","a":"30立方厘米","x":"长×宽×高=5×3×2=30。","v":"体积与表面积公式混用。"},{"q":"一个正方体的棱长是4厘米，它的表面积是多少平方厘米？","a":"96平方厘米","x":"正方体6个面全相等：4×4×6=96。","v":"正方体表面积忘记乘6。"},{"q":"棱长4厘米的正方体，体积是多少立方厘米？","a":"64立方厘米","x":"棱长×棱长×棱长=4×4×4=64。","v":"体积=棱长³与表面积=棱长²×6混淆。"},{"q":"4.2升等于多少毫升？","a":"4200毫升","x":"1升=1000毫升，4.2×1000=4200。","v":"容积单位（升、毫升）与体积单位间的进率不熟。"},{"q":"一个无盖玻璃鱼缸，长6分米、宽4分米、高5分米，做这个鱼缸至少需要玻璃多少平方分米？","a":"124平方分米","x":"无盖只算5个面：底6×4=24，前后2×6×5=60，左右2×4×5=40，共124。","v":"实际问题中不看清'无盖'，多算或少算面。"},{"q":"既是2和5的倍数，又是3的倍数的最小两位数是多少？","a":"30","x":"同时是2、3、5的倍数，个位是0且数字和是3的倍数，最小两位数是30。","v":"综合运用2、3、5倍数特征筛选数的能力不足。"}],"summary":"长方体、正方体的表面积与体积公式常混用，要分清'算面'还是'算空间'，并注意实际问题时有没有盖。"},{"grade":5,"term":"下","stage":3,"stageName":"第二次月考","scope":"人教版五年级下册第四、五单元：分数的意义和性质、图形的运动（三）","questions":[{"q":"7/9的分数单位是多少？它有几个这样的分数单位？","a":"分数单位是1/9，有7个","x":"分母是9，分数单位就是1/9；分子是7，就有7个。","v":"分数单位的概念（分母是几，分数单位就是几分之一）不清。"},{"q":"把17/5化成带分数。","a":"3又2/5","x":"17÷5=3余2，商是整数部分，余数作分子，分母不变。","v":"假分数化带分数的方法不熟，商和余数位置放错。"},{"q":"把18/24约成最简分数。","a":"3/4","x":"分子分母同除最大公因数6：18÷6=3，24÷6=4。","v":"约分不彻底，没有约成最简分数。"},{"q":"比较 3/4 和 5/6 的大小。","a":"5/6＞3/4","x":"通分：3/4=9/12，5/6=10/12，所以5/6大。","v":"异分母分数比较大小不会通分，或通分出错。"},{"q":"12和18的最大公因数是多少？","a":"6","x":"12=2×2×3，18=2×3×3，公有的质因数2×3=6。","v":"用分解质因数或短除法求最大公因数不熟练。"},{"q":"6和8的最小公倍数是多少？","a":"24","x":"6=2×3，8=2×2×2，取全部质因数：2×2×2×3=24。","v":"最大公因数与最小公倍数求法混淆。"},{"q":"把7/20化成小数。","a":"0.35","x":"7÷20=0.35，或分子分母同乘5得35/100=0.35。","v":"分数与小数互化的方法（除法或化成10、100做分母）不熟。"},{"q":"钟面上，指针从指向'3'绕中心逆时针旋转90°，指向几？","a":"指向12","x":"钟面每大格对应30°，90°是3大格，从3逆时针转3格到12。","v":"旋转三要素（中心、方向、角度）掌握不全，顺逆时针混淆。"}],"summary":"约分要约到最简，通分比较和分数小数互化要细心；旋转要看清中心、方向、角度三要素。"},{"grade":5,"term":"下","stage":4,"stageName":"期末","scope":"人教版五年级下册全册：含第六单元分数的加法和减法、第七单元折线统计图、第八单元找次品及全册综合","questions":[{"q":"计算：1/2+1/3=","a":"5/6","x":"先通分：1/2=3/6，1/3=2/6，相加得5/6。","v":"异分母分数相加减忘记先通分，直接分子加分子、分母加分母。"},{"q":"计算：5/6-3/4=","a":"1/12","x":"通分：5/6=10/12，3/4=9/12，10/12-9/12=1/12。","v":"通分找公分母出错，或相减时分子算错。"},{"q":"计算：1-2/7-3/7=","a":"2/7","x":"1=7/7，7/7-2/7-3/7=2/7。","v":"把1化成与减数同分母的分数这一步不熟。"},{"q":"简便计算：5/8+3/7+3/8","a":"10/7","x":"5/8+3/8=1，再加3/7得10/7。","v":"不会运用加法交换律把同分母的分数先凑整。"},{"q":"要反映小明从6岁到12岁每年身高变化情况，应选用什么统计图？","a":"折线统计图","x":"折线统计图能清楚地反映数量的增减变化趋势。","v":"三种统计图各自的特点和适用场景分不清。"},{"q":"9个零件中有1个是偏轻的次品，用没有砝码的天平称，至少称几次就一定能找出次品？","a":"2次","x":"把9个平均分成3组，每组3个：先称两组找出次品在哪组，再把那组3个分成1、1、1称一次。","v":"找次品不知道'尽量平均分成3份'是最优策略。"},{"q":"修路队第一天修了3/8千米，第二天修了1/4千米，两天一共修了多少千米？","a":"5/8千米","x":"3/8+1/4=3/8+2/8=5/8（千米）。","v":"异分母加法通分出错。"},{"q":"一个正方体的棱长总和是36厘米，它的棱长是多少厘米？","a":"3厘米","x":"正方体有12条棱：36÷12=3（厘米）。","v":"正方体有12条棱这一特征记不清。"}],"summary":"异分母分数加减必须先通分再计算，找次品用'尽量平均分成3份'的策略，统计图要按需选择。"},{"grade":6,"term":"上","stage":1,"stageName":"第一次月考","scope":"人教版六年级上册第一、二单元：分数乘法、位置与方向（二）","questions":[{"q":"计算：2/3×3/4=","a":"1/2","x":"分子乘分子、分母乘分母，先约分：3与3约、2与4约，得1/2。","v":"分数乘分数时不会先约分再乘，或约分位置找错。"},{"q":"计算：5×2/7=","a":"10/7","x":"5×2/7=10/7（即1又3/7），整数与分子相乘，分母不变。","v":"分数乘整数时误把整数与分母相乘。"},{"q":"计算：3/8×4/9=","a":"1/6","x":"3与9约分得1/3，4与8约分得1/2，1/3×1/2=1/6。","v":"交叉约分不熟练，算完不化成最简分数。"},{"q":"一桶水20升，用去了3/5，用去多少升？","a":"12升","x":"求20的3/5是多少，用乘法：20×3/5=12（升）。","v":"'求一个数的几分之几是多少'应该用乘法这一模型没建立。"},{"q":"一根绳子长4/5米，用去它的1/4，还剩多少米？","a":"3/5米","x":"剩下4/5的3/4：4/5×(1-1/4)=4/5×3/4=3/5（米）。","v":"没分清'用去1/4米'和'用去它的1/4'的区别。"},{"q":"图书馆在学校北偏东30°方向600米处，那么学校在图书馆的什么方向、距离多少米？","a":"南偏西30°方向600米","x":"位置是相对的：方向相反（北偏东对南偏西），角度不变，距离不变。","v":"不会描述两个地点的相对位置，反向时角度容易说错。"},{"q":"要确定一个地点的位置，需要说清楚哪两个方面？","a":"方向（含角度）和距离","x":"只有方向或只有距离都不能确定位置，两者缺一不可。","v":"对'方向+距离'确定位置这一要素理解不完整。"},{"q":"某工厂九月用水240吨，十月比九月节约了1/8，十月用水多少吨？","a":"210吨","x":"十月是九月的(1-1/8)：240×7/8=210（吨）。","v":"'比一个数多（少）几分之几'时单位'1'找不准，误算成240×1/8。"}],"summary":"分数乘法要分清'求一个数的几分之几用乘法'并找准单位'1'，位置与方向要说清方向（含角度）和距离。"},{"grade":6,"term":"上","stage":2,"stageName":"期中","scope":"人教版六年级上册第一至四单元：分数乘法、位置与方向（二）、分数除法、比","questions":[{"q":"计算：3/4÷3/8=","a":"2","x":"除以一个数等于乘它的倒数：3/4×8/3=2。","v":"分数除法忘记乘倒数，或倒数写错。"},{"q":"计算：5/6÷10=","a":"1/12","x":"5/6×1/10=5/60=1/12。","v":"除以整数时应乘1/10，误写成乘10。"},{"q":"一个数的2/5是16，这个数是多少？","a":"40","x":"已知部分求整体用除法：16÷2/5=16×5/2=40。","v":"单位'1'未知时该用除法（方程）判断不清，误用乘法。"},{"q":"把24:36化成最简整数比。","a":"2:3","x":"前项、后项同除最大公因数12：24÷12=2，36÷12=3。","v":"化简比时没有除以最大公因数，或比值与比混淆。"},{"q":"求比值：0.6:0.24","a":"2.5","x":"0.6÷0.24=2.5，比值是一个数（可以是小数、分数）。","v":"化简比（得到一个比）与求比值（得到一个数）混淆。"},{"q":"把180个苹果按3:2分给甲、乙两班，甲班分到多少个？","a":"108个","x":"总份数3+2=5，甲占3/5：180×3/5=108（个）。","v":"按比例分配时总份数算错，或忘了乘对应分率。"},{"q":"甲是乙的3/4，那么甲:乙等于多少？","a":"3:4","x":"设乙为4份，甲是3份，甲:乙=3:4。","v":"分数与比的关系（3/4即3:4）转不过来。"},{"q":"六(1)班男生与女生人数的比是5:4，女生有24人，全班有多少人？","a":"54人","x":"每份24÷4=6人，全班5+4=9份，6×9=54（人）。","v":"按比例分配应用题中不会先求出每份的量。"}],"summary":"分数除法要'乘倒数'，比要分清化简与求比值，按比例分配先求总份数；单位'1'的判断仍是常见漏洞。"},{"grade":6,"term":"上","stage":3,"stageName":"第二次月考","scope":"人教版六年级上册第五单元：圆（含分数乘除复习）","questions":[{"q":"一个圆的半径是3厘米，它的周长是多少厘米？（π取3.14）","a":"18.84厘米","x":"C=2πr=2×3.14×3=18.84（厘米）。","v":"周长公式C=2πr与面积公式S=πr²混淆。"},{"q":"一个圆的半径是5厘米，它的面积是多少平方厘米？（π取3.14）","a":"78.5平方厘米","x":"S=πr²=3.14×25=78.5。","v":"πr²算成π×5×2=31.4，平方理解错误。"},{"q":"一个圆的直径是10厘米，它的周长是多少厘米？（π取3.14）","a":"31.4厘米","x":"C=πd=3.14×10=31.4（厘米）。","v":"直径与半径关系（d=2r）不清，公式选错。"},{"q":"一个圆的半径由2厘米增加到4厘米，它的周长增加了多少厘米？（π取3.14）","a":"12.56厘米","x":"周长增加2π×(4-2)=2×3.14×2=12.56（厘米）。","v":"不会用'变化量'直接计算，或误算成面积。"},{"q":"一个圆的直径是8厘米，它的面积是多少平方厘米？（π取3.14）","a":"50.24平方厘米","x":"先求半径r=4，S=3.14×4²=3.14×16=50.24。","v":"把直径直接当半径代入公式，忘了先除以2。"},{"q":"钟面上分针长10厘米，1小时分针针尖走过多少厘米？（π取3.14）","a":"62.8厘米","x":"1小时分针正好转一圈，走过一个圆周：2×3.14×10=62.8（厘米）。","v":"不会把实际问题转化为求圆的周长。"},{"q":"一个直径10厘米的半圆，它的周长是多少厘米？（π取3.14）","a":"25.7厘米","x":"半圆周长=圆周长的一半+直径：15.7+10=25.7（厘米）。","v":"半圆的周长忘记加上直径这一条边。"},{"q":"一个圆的周长是25.12厘米，它的面积是多少平方厘米？（π取3.14）","a":"50.24平方厘米","x":"先求半径：25.12÷3.14÷2=4（厘米），S=3.14×4²=50.24。","v":"由周长求半径的逆运算不熟。"}],"summary":"圆的周长公式C=2πr和面积公式S=πr²最易混，做题先判断求周长还是面积，直径要换成半径再算面积。"},{"grade":6,"term":"上","stage":4,"stageName":"期末","scope":"人教版六年级上册全册：含第六单元百分数（一）、第七单元扇形统计图、第八单元数与形及全册综合","questions":[{"q":"把3/4化成百分数。","a":"75%","x":"3/4=75/100=75%，或3÷4=0.75=75%。","v":"分数、小数、百分数互化的方法不熟。"},{"q":"50粒种子做发芽试验，发芽了48粒，发芽率是多少？","a":"96%","x":"发芽率=发芽粒数÷总粒数×100%=48÷50×100%=96%。","v":"求百分率的公式（部分÷总量×100%）记不清。"},{"q":"一件衣服原价200元，打八折出售，现价是多少元？","a":"160元","x":"八折就是按原价的80%出售：200×80%=160（元）。","v":"折数的含义不清，八折误当成降价80%。"},{"q":"一个数先增加20%，再减少20%，现在的数比原来大还是小？","a":"小（是原来的96%）","x":"1×(1+20%)×(1-20%)=1.2×0.8=0.96，比原来小。","v":"两次变化的单位'1'不同，误以为增加20%再减少20%不变。"},{"q":"要反映各部分数量与总数之间的关系，应选用什么统计图？","a":"扇形统计图","x":"扇形统计图能清楚地表示各部分占总体的百分比。","v":"条形、折线、扇形统计图的特点混淆。"},{"q":"利用规律计算：1+3+5+7+9+11+13=","a":"49","x":"从1开始的n个连续奇数之和等于n²，这里n=7，7²=49。","v":"没掌握'奇数个数与平方数'的数形结合规律。"},{"q":"利用规律计算：1/2+1/4+1/8+1/16=","a":"15/16","x":"和等于1减去最后一个加数：1-1/16=15/16。","v":"不会借助图形发现'和逐渐接近1'的规律。"},{"q":"一个圆形花坛直径20米，围绕花坛修一条宽2米的环形小路，小路的面积是多少平方米？（π取3.14）","a":"138.16平方米","x":"外圆半径12米、内圆半径10米：3.14×(12²-10²)=3.14×44=138.16。","v":"圆环面积要先算内外两个半径，误用直径直接相减。"}],"summary":"百分数互化和百分率公式要熟，圆环等组合图形要分清内外半径，数与形结合找规律是新增易错点。"},{"grade":6,"term":"下","stage":1,"stageName":"第一次月考","scope":"人教版六年级下册第一、二单元：负数、百分数（二）","questions":[{"q":"把 -5、-1、0、3 按从小到大的顺序排列。","a":"-5＜-1＜0＜3","x":"借助数轴：越往左边的数越小，负数都比0小。","v":"负数比较大小不熟，误认为-5比-1大。"},{"q":"早晨气温是-3℃，中午比早晨上升了5℃，中午气温是多少℃？","a":"2℃","x":"-3+5=2（℃）。","v":"负数加减法的实际应用出错。"},{"q":"如果收入500元记作+500元，那么支出200元记作多少？","a":"-200元","x":"收入和支出是相反意义的量，支出用负数表示。","v":"用正负数表示相反意义的量时弄反。"},{"q":"在数轴上，表示-2的点与表示2的点相距几个单位长度？","a":"4个单位","x":"-2到0是2个单位，0到2是2个单位，共4个。","v":"数轴上两点间的距离不会算。"},{"q":"一本书打七五折后售价30元，这本书原价是多少元？","a":"40元","x":"七五折即原价的75%：30÷75%=40（元）。","v":"已知折后价求原价该用除法（单位'1'未知）判断不清。"},{"q":"某村去年收稻谷50吨，今年比去年增产二成，今年收稻谷多少吨？","a":"60吨","x":"二成即20%：50×(1+20%)=50×1.2=60（吨）。","v":"成数与百分数的对应关系（几成=百分之几十）不清。"},{"q":"王阿姨把20000元存入银行，定期两年，年利率2.25%，到期可得利息多少元？","a":"900元","x":"利息=本金×利率×存期：20000×2.25%×2=900（元）。","v":"求利息忘记乘存期。"},{"q":"某日气温最高5℃，最低-2℃，这一天的温差是多少℃？","a":"7℃","x":"温差=最高气温-最低气温：5-(-2)=7（℃）。","v":"减去负数时符号处理出错。"}],"summary":"负数比较看数轴'越左越小'，折扣、成数、利息计算都要找准单位'1'并注意乘存期。"},{"grade":6,"term":"下","stage":2,"stageName":"期中","scope":"人教版六年级下册第一至三单元：负数、百分数（二）、圆柱与圆锥","questions":[{"q":"一个圆柱的底面半径是2厘米，高是5厘米，它的表面积是多少平方厘米？（π取3.14）","a":"87.92平方厘米","x":"侧面积2πrh=2×3.14×2×5=62.8，两个底面2πr²=25.12，共87.92。","v":"圆柱表面积=侧面积+两个底面积，漏算底面或公式记错。"},{"q":"一个圆柱的底面积是12.56平方厘米，高是6厘米，体积是多少立方厘米？","a":"75.36立方厘米","x":"圆柱体积=底面积×高：12.56×6=75.36。","v":"圆柱体积公式V=Sh记不清。"},{"q":"一个圆柱的底面周长是18.84厘米，高是4厘米，它的侧面积是多少平方厘米？","a":"75.36平方厘米","x":"侧面积=底面周长×高：18.84×4=75.36。","v":"侧面展开图是长方形，长=底面周长这一关系不清。"},{"q":"一个圆锥的底面半径是3厘米，高是6厘米，体积是多少立方厘米？（π取3.14）","a":"56.52立方厘米","x":"V=1/3×πr²h=1/3×3.14×9×6=56.52。","v":"圆锥体积忘记乘1/3（除以3），这是最高频错误。"},{"q":"等底等高的圆柱和圆锥，圆柱的体积是圆锥的几倍？","a":"3倍","x":"圆锥体积=1/3×等底等高圆柱体积，反过来圆柱是圆锥的3倍。","v":"等底等高圆柱圆锥的3倍关系记反。"},{"q":"一个圆锥形沙堆，底面积是28.26平方米，高是2米，这堆沙的体积是多少立方米？","a":"18.84立方米","x":"V=1/3×Sh=28.26×2÷3=18.84。","v":"圆锥体积公式中1/3漏乘。"},{"q":"一个圆柱形水杯，底面直径8厘米，高10厘米，它的容积是多少毫升？（π取3.14）","a":"502.4毫升","x":"半径4厘米：3.14×4²×10=3.14×160=502.4（立方厘米），1立方厘米=1毫升。","v":"直径忘记换算成半径就代入公式。"},{"q":"一件商品原价250元，现价200元，这件商品打了几折？","a":"八折","x":"200÷250=0.8=80%，即八折。","v":"折扣=现价÷原价这一关系用反（误用原价÷现价）。"}],"summary":"圆柱表面积要分清有几个面，圆锥体积千万别忘乘1/3，实际问题先把直径换算成半径。"},{"grade":6,"term":"下","stage":3,"stageName":"第二次月考","scope":"人教版六年级下册第四单元：比例（含图形的放大与缩小）","questions":[{"q":"在比例 3:4=9:□ 中，□里应填多少？","a":"12","x":"外项积等于内项积：4×9=36，36÷3=12。","v":"比例的基本性质（内项积=外项积）不会用。"},{"q":"解比例：x:6=8:12","a":"x=4","x":"12x=6×8=48，x=4。","v":"解比例写成12x=8时内外项位置放错。"},{"q":"解比例：1.2:0.3=4:x","a":"x=1","x":"1.2x=0.3×4=1.2，x=1。","v":"解比例中小数运算出错。"},{"q":"速度一定，路程和时间成什么比例？","a":"正比例","x":"路程÷时间=速度（一定），比值一定成正比例。","v":"正、反比例的判断标准（比值一定还是乘积一定）不清。"},{"q":"长方形的面积一定，长和宽成什么比例？","a":"反比例","x":"长×宽=面积（一定），乘积一定成反比例。","v":"判断成什么比例时不先找不变量。"},{"q":"把一个边长4厘米的正方形按2:1放大，放大后的边长和面积各是多少？","a":"边长8厘米，面积64平方厘米","x":"边长放大2倍是8厘米，面积是8×8=64（平方厘米），面积放大了4倍。","v":"误以为按2:1放大后面积也只放大2倍。"},{"q":"一幅地图上5厘米表示实际200千米，这幅地图的比例尺是多少？","a":"1:4000000","x":"200千米=20000000厘米，5:20000000=1:4000000。","v":"比例尺计算时单位换算出错（千米化厘米少乘或忘记乘100000）。"},{"q":"汽车速度一定，3小时行驶180千米。照这样计算，5小时行驶多少千米？（用比例解答）","a":"300千米","x":"设5小时行x千米，180÷3=x÷5，x=300（千米）。","v":"正比例应用题不会列比例式，或速度这个'一定'的量没抓住。"}],"summary":"解比例紧扣'外项积等于内项积'，判断正反比例先找不变量，图形放大缩小时边长按比变、面积按比的平方变。"},{"grade":6,"term":"下","stage":4,"stageName":"期末","scope":"人教版六年级下册全册总复习：含第五单元鸽巢问题及负数、百分数、圆柱圆锥、比例等综合","questions":[{"q":"13名学生中，至少有几名学生在同一个月过生日？","a":"至少2名","x":"把12个月看作12个鸽巢，13÷12=1……2，总有一个月至少有1+1=2人过生日。","v":"鸽巢问题不会用'商+1'确定'至少数'。"},{"q":"把7只鸽子放进4个笼子，至少有一个笼子里放几只鸽子？","a":"至少2只","x":"7÷4=1……3，即使每笼1只还剩3只，总有笼子至少2只。","v":"鸽巢原理中余数的处理不熟。"},{"q":"大于-3且小于2的整数有哪些？","a":"-2、-1、0、1","x":"在数轴上-3和2之间（不含两端）的整数依次是-2、-1、0、1。","v":"负整数范围列举时漏掉负数或端点处理错。"},{"q":"一件商品按原价的90%出售是180元，这件商品原价是多少元？","a":"200元","x":"原价是单位'1'且未知，用除法：180÷90%=200（元）。","v":"已知部分量和分率求单位'1'时误用乘法。"},{"q":"一个圆柱与一个圆锥等底等高，体积之和是48立方厘米，圆柱的体积是多少？","a":"36立方厘米","x":"等底等高时圆柱:圆锥体积=3:1，共4份：48÷4×3=36（立方厘米）。","v":"圆柱圆锥体积的3:1关系用反。"},{"q":"甲、乙两数的比是3:5，两数之和是64，甲数是多少？","a":"24","x":"总份数8份：64÷8×3=24。","v":"按比例分配先求每份的量这一步骤不熟。"},{"q":"一批货物，第一天运走1/4，第二天运走2/5，还剩这批货物的几分之几？","a":"7/20","x":"1-1/4-2/5=20/20-5/20-8/20=7/20。","v":"把'1'化成同分母再连减时不熟。"},{"q":"大小两个圆的半径比是3:2，它们的面积比是多少？","a":"9:4","x":"面积比等于半径比的平方：3²:2²=9:4。","v":"误认为面积比等于半径比，忘了要平方。"}],"summary":"总复习要打通各单元：鸽巢问题用'商+1'，等底等高圆锥是圆柱的1/3，综合题先找单位'1'和不变量。"}];

// build grade groups
(function(){
  const names = {1:'一年级',2:'二年级',3:'三年级',4:'四年级',5:'五年级',6:'六年级'};
  const scopes = {1:'20以内加减 → 100以内数与加减',2:'表内乘除 → 万以内数·克千克',3:'时分秒·万以内加减 → 年月日·小数初步',4:'大数的认识 → 小数加减·鸡兔同笼',5:'小数乘除·简易方程 → 分数加减·找次品',6:'分数乘除·比·圆 → 百分数·圆柱圆锥·比例'};
  const wrap = document.querySelector('.wrap');
  const book = document.getElementById('book');
  for(let g=1; g<=6; g++){
    const ps = PAPERS.filter(p=>p.grade===g);
    if(!ps.length) continue;
    const div = document.createElement('div');
    div.className = 'grade';
    let inner = '<div class="ghead">'+names[g]+'<span>'+scopes[g]+'</span></div>';
    for(const term of ['上','下']){
      inner += '<div class="termgrp"><h3>'+names[g]+term+'</h3>';
      ps.filter(p=>p.term===term).sort((a,b)=>a.stage-b.stage).forEach(p=>{
        const pid = 'g'+g+term+'s'+p.stage;
        inner += '<a class="paperlink" href="#'+pid+'">'+p.stageName+' · 阶段卷<span class="stagetag">8题</span></a>';
        inner += '<details class="paperdetail" id="'+pid+'"><summary>展开：'+names[g]+term+' '+p.stageName+'</summary>';
        inner += '<div class="scope">覆盖：'+p.scope+'</div>';
        p.questions.forEach((q,i)=>{
          inner += '<div class="qblock"><div class="qt">'+(i+1)+'. '+q.q+'</div>';
          inner += '<div class="ans">答案：'+q.a+'</div>';
          if(q.x) inner += '<div class="exp">解析：'+q.x+'</div>';
          if(q.v) inner += '<div class="vul"><b>答错说明：</b>'+q.v+'</div>';
          inner += '</div>';
        });
        if(p.summary) inner += '<div class="psum"><b>本卷常见漏洞：</b>'+p.summary+'</div>';
        inner += '</details>';
      });
      inner += '</div>';
    }
    div.innerHTML = inner;
    wrap.insertBefore(div, book);
  }
